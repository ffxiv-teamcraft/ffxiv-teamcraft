defaults: &defaults
  working_directory: ~/ffxiv-teamcraft
  docker:
    - image: cimg/node:20.14-browsers


version: 2.1
orbs:
  win: circleci/windows@5.0.0

commands:
  install-dependencies:
    steps:
      - restore_cache:
          name: Restore node_modules
          keys:
            - node-modules-v1-{{ arch }}-{{ checksum "yarn.lock" }}
      - run:
          name: Install local dependencies
          command: yarn install --frozen-lockfile --ignore-scripts
      - save_cache:
          name: Save node_modules
          key: node-modules-v1-{{ arch }}-{{ checksum "yarn.lock" }}
          paths:
            - node_modules

  firebase-deploy:
    parameters:
      project:
        type: string
    steps:
      - run:
          name: Deploying web
          command: npx --yes firebase-tools@13.10.0 deploy -P << parameters.project >> --only hosting --token "$FIREBASE_TOKEN"

jobs:
  lint:
    <<: *defaults
    steps:
      - checkout
      - install-dependencies
      - run:
          name: Lint code and JSON
          command: yarn run lint


  test:
    <<: *defaults
    steps:
      - checkout
      - install-dependencies
      - run:
          name: Testing
          command: yarn run test
      - run:
          name: Codecov upload
          command: yarn run codecov


  build:
    <<: *defaults
    resource_class: large
    steps:
      - checkout
      - install-dependencies
      - run:
          name: Building
          command: |
            if [ "${CIRCLE_BRANCH}" == "master" ]; then
                yarn run build:prod
            else
                yarn run build:beta
            fi
          no_output_timeout: 30m
      - persist_to_workspace:
          root: ~/
          paths:
            - ffxiv-teamcraft/dist


  build-api:
    <<: *defaults
    steps:
      - checkout
      - install-dependencies
      - run:
          name: Building
          command: yarn api:build
      - persist_to_workspace:
          root: ~/
          paths:
            - ffxiv-teamcraft/dist


  deploy-hosting:
    working_directory: ~/ffxiv-teamcraft
    docker:
      - image: cimg/base:2026.09
    steps:
      - checkout
      - attach_workspace:
          at: ~/
      - add_ssh_keys:
          fingerprints:
            - "fe:16:5e:5a:4c:4a:3e:36:80:a7:13:5b:1f:64:7b:e0"
      - run:
          name: Install rsync
          command: sudo apt-get update && sudo apt-get install -y rsync
      - run:
          name: Deploying cdn to OVH server
          command: bash tools/cdn/deploy.sh
      # For a manual upload: extract the archive at the root of the repository, then run tools/cdn/deploy.sh
      - run:
          name: Packaging client build for a manual upload
          when: on_fail
          command: |
            mkdir -p /tmp/artifacts
            tar -czf /tmp/artifacts/client-$(jq -r .version package.json).tar.gz dist/apps/client
      - store_artifacts:
          path: /tmp/artifacts
      - store_artifacts:
          path: ./rsync.log


  deploy-firebase-hosting:
    <<: *defaults
    steps:
      - checkout
      - attach_workspace:
          at: ~/
      - firebase-deploy:
          project: default

  deploy-api:
    working_directory: ~/ffxiv-teamcraft
    docker:
      - image: google/cloud-sdk:587.0.0
    steps:
      - checkout
      - attach_workspace:
          at: ~/
      - run:
          name: Authorize GCloud Command Line Tool
          command: |
            echo $GCLOUD_SERVICE_KEY | gcloud auth activate-service-account --key-file=-
      - run:
          name: Deploy Could Run TC API
          command: gcloud builds submit --config ./apps/api/cloudbuild.yaml . && gcloud beta run deploy api --image gcr.io/ffxivteamcraft/api --region us-central1 --allow-unauthenticated --update-secrets=XIVAPI_KEY=XIVAPI_KEY:latest --update-secrets=FFCAFE_KEY=FFCAFE_KEY:latest


  release-desktop:
    executor:
      name: win/default
    working_directory: ~/ffxiv-teamcraft
    steps:
      - checkout
      - run: choco install wget -y
      - run:
          command: wget https://bootstrap.pypa.io/get-pip.py -P C:\Users\circleci\Downloads\
          shell: cmd.exe
      - run:
          command: python C:\Users\circleci\Downloads\get-pip.py
          shell: cmd.exe
      - run:
          command: pip install setuptools
          shell: cmd.exe
      - run:
          command: wget https://nodejs.org/dist/v20.14.0/node-v20.14.0-x64.msi -P C:\Users\circleci\Downloads\
          shell: cmd.exe
      - run: MsiExec.exe /i C:\Users\circleci\Downloads\node-v20.14.0-x64.msi /qn
      - run:
          name: Install yarn
          command: |
             Start-Process powershell -verb runAs -Args "-start GeneralProfile"
             nvm install 20.14.0
             nvm use 20.14.0
             npm i -g yarn
      - run:
          name: Installing dependencies for windows
          command: yarn install --frozen-lockfile
      - run:
          name: Deploying desktop on github
          no_output_timeout: 30m
          command: yarn run electron:setup:publish


  release-desktop-linux:
    <<: *defaults
    resource_class: large
    steps:
      - checkout
      - restore_cache:
          name: Restore Yarn Package Cache
          keys:
            - yarn-packages-{{ checksum "yarn.lock" }}
      - run:
          name: Install dependencies
          command: yarn install --frozen-lockfile
      - save_cache:
          name: Save Yarn Package Cache
          key: yarn-packages-{{ checksum "yarn.lock" }}
          paths:
            - ~/.cache/yarn
      - run:
          name: Build and publish AppImage
          command: yarn build:appimage:publish
          no_output_timeout: 30m
          environment:
            NODE_OPTIONS: --max-old-space-size=4096


  deploy-staging:
    <<: *defaults
    steps:
      - checkout
      - attach_workspace:
          at: ~/
      - firebase-deploy:
          project: beta


workflows:
  version: 2
  flow:
    jobs:
      - lint
      - build
      - build-api
      - deploy-hosting:
          requires:
            - lint
            - build
          filters:
            branches:
              only: master
      - deploy-api:
          requires:
            - lint
            - build-api
          filters:
            branches:
              only: master
      - deploy-firebase-hosting:
          requires:
            - deploy-hosting
          filters:
            branches:
              only: master
      - release-desktop:
          requires:
            - lint
          filters:
            branches:
              only: master
      - release-desktop-linux:
          requires:
            - lint
          filters:
            branches:
              only: master
      - deploy-staging:
          requires:
            - lint
            - build
          filters:
            branches:
              only: staging
